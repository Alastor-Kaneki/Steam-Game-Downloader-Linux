[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "steam-library-downloader-linux"
version = "0.1.0"
description = "Linux GUI for QR-authenticated Steam library and depot downloads"
requires-python = ">=3.10"
dependencies = ["qrcode==8.2"]
license = {text = "GPL-2.0-only"}
authors = [{name = "Alastor Kaneki"}]

[project.gui-scripts]
steam-library-downloader = "steam_library_downloader.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
