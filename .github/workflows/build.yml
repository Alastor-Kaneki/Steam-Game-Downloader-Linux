name: Build Linux AppImage

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk git curl libfuse2 desktop-file-utils librsvg2-bin
          python -m pip install --upgrade pip pytest qrcode pyinstaller

      - name: Unit tests
        env:
          PYTHONPATH: src
        run: pytest -q

      - name: Build AppImage
        run: ./tools/build_appimage.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Steam-Library-Downloader-AppImage
          path: dist/*
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
